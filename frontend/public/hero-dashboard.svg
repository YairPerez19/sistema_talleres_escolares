<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a10"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="150" y1="200" x2="650" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222228"/>
      <stop offset="1" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="laptopBase" x1="100" y1="440" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a30"/>
      <stop offset="0.5" stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a85563"/>
      <stop offset="1" stop-color="#722F37"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="100" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a85563" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a85563" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a85563" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="170" y="100" width="460" height="310" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="300" rx="250" ry="180" fill="#722F37" opacity="0.04" filter="url(#glow)"/>

  <!-- Warm bokeh lights -->
  <circle cx="100" cy="80" r="40" fill="#a85563" opacity="0.03"/>
  <circle cx="700" cy="120" r="30" fill="#a85563" opacity="0.02"/>
  <circle cx="650" cy="60" r="20" fill="#a85563" opacity="0.03"/>
  <circle cx="150" cy="500" r="25" fill="#722F37" opacity="0.04"/>

  <!-- Desk -->
  <path d="M0 460 Q200 440 400 450 Q600 460 800 440 L800 600 L0 600Z" fill="#1a1510" opacity="0.5"/>
  <path d="M0 480 Q200 465 400 472 Q600 480 800 465 L800 600 L0 600Z" fill="#151010" opacity="0.3"/>

  <!-- Laptop screen housing -->
  <rect x="140" y="90" width="520" height="340" rx="16" fill="url(#laptopBody)" stroke="#3a3a42" stroke-width="1" filter="url(#shadow)"/>

  <!-- Screen bezel inner -->
  <rect x="145" y="95" width="510" height="330" rx="14" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>

  <!-- Screen content -->
  <g clip-path="url(#screenClip)">
    <rect x="170" y="100" width="460" height="310" fill="#0d0d12"/>

    <!-- Subtle grid -->
    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.4" fill="#fff" opacity="0.02"/>
    </pattern>
    <rect x="170" y="100" width="460" height="310" fill="url(#gridDots)"/>

    <!-- Sidebar -->
    <rect x="170" y="100" width="55" height="310" fill="#12121a"/>
    <line x1="225" y1="100" x2="225" y2="410" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Sidebar logo -->
    <rect x="183" y="115" width="28" height="18" rx="4" fill="#722F37"/>
    <text x="188" y="128" fill="#fff" font-family="system-ui" font-weight="700" font-size="8">SITE</text>

    <!-- Sidebar nav items -->
    <rect x="180" y="148" width="38" height="6" rx="2" fill="#722F37" opacity="0.5"/>
    <rect x="180" y="165" width="38" height="6" rx="2" fill="#ffffff" opacity="0.06"/>
    <rect x="180" y="182" width="38" height="6" rx="2" fill="#ffffff" opacity="0.06"/>
    <rect x="180" y="199" width="38" height="6" rx="2" fill="#ffffff" opacity="0.06"/>
    <rect x="180" y="216" width="38" height="6" rx="2" fill="#ffffff" opacity="0.06"/>

    <!-- Sidebar bottom avatar -->
    <circle cx="197" cy="390" r="10" fill="#722F37" opacity="0.3"/>
    <circle cx="197" cy="387" r="3.5" fill="#a85563" opacity="0.5"/>

    <!-- Top bar -->
    <rect x="225" y="100" width="405" height="36" fill="#111118" opacity="0.8"/>
    <line x1="225" y1="136" x2="630" y2="136" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Breadcrumb -->
    <text x="240" y="123" fill="#fff" font-family="system-ui" font-size="9" font-weight="600">Dashboard</text>
    <text x="305" y="123" fill="#fff" font-family="system-ui" font-size="8" opacity="0.3">Asistencia General</text>

    <!-- Action buttons -->
    <rect x="520" y="113" width="45" height="16" rx="8" fill="#722F37" opacity="0.3"/>
    <text x="528" y="124" fill="#a85563" font-family="system-ui" font-size="7" font-weight="600">Exportar</text>
    <rect x="572" y="113" width="45" height="16" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="580" y="124" fill="#fff" font-family="system-ui" font-size="7" opacity="0.5">Filtros</text>

    <!-- Main content area -->

    <!-- Stats cards row -->
    <!-- Stat 1 -->
    <rect x="240" y="148" width="120" height="60" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="254" y="168" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Total Alumnos</text>
    <text x="254" y="190" fill="#fff" font-family="system-ui" font-weight="700" font-size="18">1,247</text>
    <text x="310" y="190" fill="#4ade80" font-family="system-ui" font-size="7">+12%</text>

    <!-- Stat 2 -->
    <rect x="370" y="148" width="120" height="60" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="384" y="168" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Asistencia Hoy</text>
    <text x="384" y="190" fill="#fff" font-family="system-ui" font-weight="700" font-size="18">94.2%</text>
    <text x="440" y="190" fill="#a85563" font-family="system-ui" font-size="7">+3.1%</text>

    <!-- Stat 3 -->
    <rect x="500" y="148" width="120" height="60" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="514" y="168" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Talleres Activos</text>
    <text x="514" y="190" fill="#fff" font-family="system-ui" font-weight="700" font-size="18">45</text>
    <text x="540" y="190" fill="#fff" font-family="system-ui" font-size="7" opacity="0.3">de 48</text>

    <!-- Area chart -->
    <rect x="240" y="218" width="190" height="110" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="254" y="238" fill="#fff" font-family="system-ui" font-size="8" font-weight="600">Asistencia Semanal</text>

    <!-- Chart grid lines -->
    <line x1="254" y1="255" x2="416" y2="255" stroke="#fff" stroke-opacity="0.03"/>
    <line x1="254" y1="275" x2="416" y2="275" stroke="#fff" stroke-opacity="0.03"/>
    <line x1="254" y1="295" x2="416" y2="295" stroke="#fff" stroke-opacity="0.03"/>

    <!-- Area fill -->
    <path d="M258 290 L280 270 L302 280 L324 255 L346 260 L368 240 L390 250 L412 235 L412 310 L258 310Z" fill="url(#chartGrad)"/>
    <!-- Area line -->
    <path d="M258 290 L280 270 L302 280 L324 255 L346 260 L368 240 L390 250 L412 235" fill="none" stroke="#a85563" stroke-width="1.5"/>
    <!-- Data points -->
    <circle cx="258" cy="290" r="2" fill="#a85563"/>
    <circle cx="280" cy="270" r="2" fill="#a85563"/>
    <circle cx="302" cy="280" r="2" fill="#a85563"/>
    <circle cx="324" cy="255" r="2" fill="#a85563"/>
    <circle cx="346" cy="260" r="2" fill="#a85563"/>
    <circle cx="368" cy="240" r="2" fill="#a85563"/>
    <circle cx="390" cy="250" r="2" fill="#a85563"/>
    <circle cx="412" cy="235" r="2.5" fill="#a85563" stroke="#0d0d12" stroke-width="1.5"/>

    <!-- Bar chart -->
    <rect x="440" y="218" width="180" height="110" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="454" y="238" fill="#fff" font-family="system-ui" font-size="8" font-weight="600">Cupos por Taller</text>

    <!-- Bars -->
    <rect x="458" y="270" width="18" height="45" rx="3" fill="url(#barGrad1)"/>
    <rect x="482" y="255" width="18" height="60" rx="3" fill="url(#barGrad1)"/>
    <rect x="506" y="280" width="18" height="35" rx="3" fill="url(#barGrad2)"/>
    <rect x="530" y="260" width="18" height="55" rx="3" fill="url(#barGrad1)"/>
    <rect x="554" y="250" width="18" height="65" rx="3" fill="url(#barGrad1)"/>
    <rect x="578" y="275" width="18" height="40" rx="3" fill="url(#barGrad2)"/>
    <rect x="602" y="265" width="18" height="50" rx="3" fill="url(#barGrad1)"/>

    <!-- X labels -->
    <text x="462" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Fut</text>
    <text x="486" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Dan</text>
    <text x="508" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Aje</text>
    <text x="532" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Bas</text>
    <text x="556" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Tea</text>
    <text x="580" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Tae</text>
    <text x="604" y="322" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">Fot</text>

    <!-- Bottom table -->
    <rect x="240" y="338" width="380" height="60" rx="10" fill="#151520" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="254" y="356" fill="#fff" font-family="system-ui" font-size="7" font-weight="600">Instructores Activos</text>

    <!-- Table header -->
    <rect x="248" y="364" width="364" height="10" rx="2" fill="#ffffff" fill-opacity="0.03"/>
    <text x="260" y="372" fill="#fff" font-family="system-ui" font-size="6" opacity="0.3">Nombre</text>
    <text x="380" y="372" fill="#fff" font-family="system-ui" font-size="6" opacity="0.3">Taller</text>
    <text x="470" y="372" fill="#fff" font-family="system-ui" font-size="6" opacity="0.3">Alumnos</text>
    <text x="540" y="372" fill="#fff" font-family="system-ui" font-size="6" opacity="0.3">Asistencia</text>

    <!-- Table rows -->
    <text x="260" y="388" fill="#fff" font-family="system-ui" font-size="6">Prof. García</text>
    <rect x="380" y="383" width="40" height="8" rx="3" fill="#722F37" opacity="0.2"/>
    <text x="384" y="389" fill="#a85563" font-family="system-ui" font-size="5">Fútbol</text>
    <text x="480" y="388" fill="#fff" font-family="system-ui" font-size="6">18</text>
    <text x="550" y="388" fill="#4ade80" font-family="system-ui" font-size="6">96%</text>

    <text x="260" y="398" fill="#fff" font-family="system-ui" font-size="6">Profa. López</text>
    <rect x="380" y="393" width="45" height="8" rx="3" fill="#722F37" opacity="0.2"/>
    <text x="384" y="399" fill="#a85563" font-family="system-ui" font-size="5">Danza</text>
    <text x="480" y="398" fill="#fff" font-family="system-ui" font-size="6">12</text>
    <text x="550" y="398" fill="#4ade80" font-family="system-ui" font-size="6">98%</text>
  </g>

  <!-- Camera dot -->
  <circle cx="400" cy="95" r="2.5" fill="#1a1a1e"/>
  <circle cx="400" cy="95" r="1.2" fill="#2a2a35" opacity="0.6"/>

  <!-- Laptop base / keyboard area -->
  <path d="M130 430 L670 430 L700 460 L100 460Z" fill="url(#laptopBase)" stroke="#3a3a42" stroke-width="0.5"/>

  <!-- Trackpad -->
  <rect x="355" y="440" width="90" height="10" rx="4" fill="#1e1e24" stroke="#2a2a32" stroke-width="0.5"/>

  <!-- Keyboard dots suggestion -->
  <g opacity="0.15">
    <rect x="200" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="210" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="220" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="230" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="560" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="570" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="580" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
    <rect x="590" y="434" width="6" height="3" rx="1" fill="#3a3a42"/>
  </g>

  <!-- Screen reflection streak -->
  <path d="M200 105 L280 105" stroke="#fff" stroke-width="0.5" opacity="0.04"/>
  <path d="M195 108 L250 108" stroke="#fff" stroke-width="0.3" opacity="0.03"/>

  <!-- Coffee cup decoration -->
  <ellipse cx="100" cy="470" rx="28" ry="8" fill="#1a1510" opacity="0.6"/>
  <rect x="80" y="430" width="40" height="38" rx="4" fill="#2a2520" opacity="0.5"/>
  <path d="M120 440 Q135 440 135 455 Q135 470 120 470" fill="none" stroke="#2a2520" stroke-width="3" opacity="0.4"/>
  <rect x="82" y="432" width="36" height="8" rx="4" fill="#3a3028" opacity="0.4"/>
  <!-- Steam -->
  <path d="M95 425 Q92 415 97 405" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.04"/>
  <path d="M102 422 Q105 412 100 402" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.03"/>
  <path d="M108 425 Q106 415 110 407" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.03"/>

  <!-- Book stack -->
  <rect x="660" y="420" width="60" height="8" rx="1" fill="#722F37" opacity="0.2"/>
  <rect x="658" y="414" width="64" height="6" rx="1" fill="#a85563" opacity="0.15"/>
  <rect x="662" y="409" width="55" height="5" rx="1" fill="#722F37" opacity="0.1"/>

  <!-- Floating particles -->
  <circle cx="80" cy="200" r="2" fill="#a85563" opacity="0.2"/>
  <circle cx="720" cy="300" r="1.5" fill="#a85563" opacity="0.15"/>
  <circle cx="50" cy="350" r="1" fill="#722F37" opacity="0.2"/>
  <circle cx="750" cy="180" r="2.5" fill="#722F37" opacity="0.1"/>
</svg>
