<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12080c"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="tabletBody" x1="100" y1="80" x2="700" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252530"/>
      <stop offset="1" stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="wineAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a85563"/>
      <stop offset="1" stop-color="#722F37"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#722F37" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="moduleGrad1" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#722F37" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a85563" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="moduleGrad2" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a85563" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a85563" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="moduleGrad3" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#722F37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="130" y="110" width="540" height="360" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="300" rx="350" ry="200" fill="#722F37" opacity="0.04" filter="url(#glow)"/>

  <!-- Geometric background pattern -->
  <g opacity="0.03">
    <line x1="0" y1="150" x2="800" y2="100" stroke="#a85563" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="250" stroke="#a85563" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="800" y2="400" stroke="#a85563" stroke-width="0.5"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#722F37" stroke-width="0.5"/>
    <circle cx="700" cy="500" r="80" fill="none" stroke="#722F37" stroke-width="0.5"/>
    <rect x="600" y="50" width="120" height="120" rx="20" fill="none" stroke="#a85563" stroke-width="0.5" transform="rotate(15 660 110)"/>
  </g>

  <!-- Desk surface hint -->
  <path d="M0 520 Q400 500 800 510 L800 600 L0 600Z" fill="#12100e" opacity="0.4"/>

  <!-- Tablet body -->
  <rect x="100" y="78" width="600" height="430" rx="30" fill="url(#tabletBody)" stroke="#3a3a45" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Bezel highlight -->
  <rect x="103" y="81" width="594" height="424" rx="27" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="130" y="110" width="540" height="360" fill="#0e0e14"/>

    <!-- Subtle grid pattern -->
    <pattern id="smallDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.4" fill="#fff" opacity="0.025"/>
    </pattern>
    <rect x="130" y="110" width="540" height="360" fill="url(#smallDots)"/>

    <!-- Top header bar -->
    <rect x="130" y="110" width="540" height="50" fill="#12121a"/>
    <line x1="130" y1="160" x2="670" y2="160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Logo and brand -->
    <rect x="150" y="125" width="30" height="20" rx="5" fill="#722F37"/>
    <text x="157" y="139" fill="#fff" font-family="system-ui" font-weight="700" font-size="10">SITE</text>
    <text x="186" y="139" fill="#fff" font-family="system-ui" font-size="9" opacity="0.4">| CBTis No 61</text>

    <!-- Header right: notification + avatar -->
    <circle cx="620" cy="138" r="8" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="620" cy="138" r="5" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    <circle cx="620" cy="135" r="2" fill="#fff" opacity="0.2"/>
    <circle cx="645" cy="138" r="10" fill="#722F37" opacity="0.4"/>
    <circle cx="645" cy="134" r="3.5" fill="#a85563" opacity="0.6"/>
    <path d="M638 142 Q645 138 652 142" fill="#a85563" opacity="0.3"/>

    <!-- Welcome section -->
    <text x="150" y="185" fill="#fff" font-family="system-ui" font-weight="700" font-size="16">Panel de Control</text>
    <text x="150" y="202" fill="#fff" font-family="system-ui" font-size="9" opacity="0.4">Bienvenido de vuelta, Administrador</text>

    <!-- Top stat cards -->
    <!-- Card 1: Alumnos -->
    <rect x="150" y="215" width="155" height="70" rx="12" fill="url(#platformGrad)" stroke="#722F37" stroke-opacity="0.12" stroke-width="0.5"/>
    <rect x="164" y="228" width="28" height="28" rx="8" fill="#722F37" opacity="0.25"/>
    <text x="171" y="247" fill="#a85563" font-family="system-ui" font-size="16">👥</text>
    <text x="200" y="240" fill="#fff" font-family="system-ui" font-size="16" font-weight="700">1,247</text>
    <text x="200" y="253" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Alumnos inscritos</text>
    <text x="200" y="275" fill="#4ade80" font-family="system-ui" font-size="7">+12% este mes</text>

    <!-- Card 2: Talleres -->
    <rect x="317" y="215" width="155" height="70" rx="12" fill="url(#moduleGrad2)" stroke="#a85563" stroke-opacity="0.08" stroke-width="0.5"/>
    <rect x="331" y="228" width="28" height="28" rx="8" fill="#a85563" opacity="0.15"/>
    <text x="338" y="247" fill="#d4849a" font-family="system-ui" font-size="16">📚</text>
    <text x="367" y="240" fill="#fff" font-family="system-ui" font-size="16" font-weight="700">45</text>
    <text x="367" y="253" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Talleres activos</text>
    <text x="367" y="275" fill="#a85563" font-family="system-ui" font-size="7">3 por iniciar</text>

    <!-- Card 3: Asistencia -->
    <rect x="484" y="215" width="155" height="70" rx="12" fill="url(#moduleGrad3)" stroke="#722F37" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="498" y="228" width="28" height="28" rx="8" fill="#722F37" opacity="0.2"/>
    <text x="505" y="247" fill="#a85563" font-family="system-ui" font-size="16">✅</text>
    <text x="534" y="240" fill="#fff" font-family="system-ui" font-size="16" font-weight="700">94.2%</text>
    <text x="534" y="253" fill="#fff" font-family="system-ui" font-size="7" opacity="0.4">Asistencia hoy</text>
    <text x="534" y="275" fill="#4ade80" font-family="system-ui" font-size="7">+3.1% vs ayer</text>

    <!-- Main content: two columns -->

    <!-- Left: Activity chart -->
    <rect x="150" y="298" width="255" height="160" rx="12" fill="#14141e" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="164" y="318" fill="#fff" font-family="system-ui" font-size="9" font-weight="600">Actividad Reciente</text>

    <!-- Mini bar chart -->
    <rect x="164" y="330" width="227" height="115" fill="#ffffff" fill-opacity="0.01"/>

    <!-- Chart grid -->
    <line x1="164" y1="355" x2="391" y2="355" stroke="#fff" stroke-opacity="0.03"/>
    <line x1="164" y1="380" x2="391" y2="380" stroke="#fff" stroke-opacity="0.03"/>
    <line x1="164" y1="405" x2="391" y2="405" stroke="#fff" stroke-opacity="0.03"/>
    <line x1="164" y1="430" x2="391" y2="430" stroke="#fff" stroke-opacity="0.03"/>

    <!-- Y axis labels -->
    <text x="158" y="358" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">100%</text>
    <text x="160" y="383" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">75%</text>
    <text x="160" y="408" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">50%</text>
    <text x="160" y="433" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">0%</text>

    <!-- Bars for each day -->
    <rect x="180" y="385" width="18" height="45" rx="3" fill="url(#moduleGrad1)"/>
    <rect x="205" y="370" width="18" height="60" rx="3" fill="url(#moduleGrad1)"/>
    <rect x="230" y="390" width="18" height="40" rx="3" fill="url(#moduleGrad2)"/>
    <rect x="255" y="360" width="18" height="70" rx="3" fill="url(#moduleGrad1)"/>
    <rect x="280" y="375" width="18" height="55" rx="3" fill="url(#moduleGrad1)"/>
    <rect x="305" y="365" width="18" height="65" rx="3" fill="url(#moduleGrad1)"/>
    <rect x="330" y="380" width="18" height="50" rx="3" fill="url(#moduleGrad2)"/>
    <rect x="355" y="355" width="18" height="75" rx="3" fill="url(#moduleGrad1)"/>

    <!-- X axis labels -->
    <text x="183" y="440" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">Lun</text>
    <text x="209" y="440" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">Mar</text>
    <text x="234" y="440" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">Mié</text>
    <text x="259" y="440" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">Jue</text>
    <text x="284" y="440" fill="#fff" font-family="system-ui" font-size="5" opacity="0.2">Vie</text>

    <!-- Right: Workshop list -->
    <rect x="417" y="298" width="222" height="160" rx="12" fill="#14141e" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    <text x="431" y="318" fill="#fff" font-family="system-ui" font-size="9" font-weight="600">Talleres Populares</text>

    <!-- Workshop list items -->
    <!-- Item 1 -->
    <rect x="428" y="330" width="200" height="26" rx="6" fill="#ffffff" fill-opacity="0.02"/>
    <text x="438" y="346" font-family="system-ui" font-size="10">⚽</text>
    <text x="456" y="346" fill="#fff" font-family="system-ui" font-size="7" font-weight="500">Fútbol Varonil</text>
    <text x="570" y="346" fill="#fff" font-family="system-ui" font-size="7" font-weight="600">18</text>
    <text x="585" y="346" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">cupos</text>

    <!-- Item 2 -->
    <rect x="428" y="360" width="200" height="26" rx="6" fill="#ffffff" fill-opacity="0.02"/>
    <text x="438" y="376" font-family="system-ui" font-size="10"></text>
    <text x="456" y="376" fill="#fff" font-family="system-ui" font-size="7" font-weight="500">Danza</text>
    <text x="570" y="376" fill="#fff" font-family="system-ui" font-size="7" font-weight="600">12</text>
    <text x="585" y="376" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">cupos</text>

    <!-- Item 3 -->
    <rect x="428" y="390" width="200" height="26" rx="6" fill="#ffffff" fill-opacity="0.02"/>
    <text x="438" y="406" font-family="system-ui" font-size="10">🏀</text>
    <text x="456" y="406" fill="#fff" font-family="system-ui" font-size="7" font-weight="500">Basquetbol</text>
    <text x="570" y="406" fill="#fff" font-family="system-ui" font-size="7" font-weight="600">15</text>
    <text x="585" y="406" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">cupos</text>

    <!-- Item 4 -->
    <rect x="428" y="420" width="200" height="26" rx="6" fill="#ffffff" fill-opacity="0.02"/>
    <text x="438" y="436" font-family="system-ui" font-size="10">🎭</text>
    <text x="456" y="436" fill="#fff" font-family="system-ui" font-size="7" font-weight="500">Teatro</text>
    <text x="570" y="436" fill="#fff" font-family="system-ui" font-size="7" font-weight="600">8</text>
    <text x="585" y="436" fill="#fff" font-family="system-ui" font-size="5" opacity="0.3">cupos</text>
  </g>

  <!-- Tablet camera -->
  <circle cx="400" cy="90" r="3.5" fill="#1a1a22" stroke="#2a2a35" stroke-width="0.5"/>
  <circle cx="400" cy="90" r="1.5" fill="#3a3a48" opacity="0.4"/>

  <!-- Side buttons -->
  <rect x="97" y="200" width="3" height="25" rx="1.5" fill="#2a2a32"/>
  <rect x="97" y="240" width="3" height="35" rx="1.5" fill="#2a2a32"/>
  <rect x="97" y="290" width="3" height="35" rx="1.5" fill="#2a2a32"/>
  <rect x="700" y="230" width="3" height="30" rx="1.5" fill="#2a2a32"/>

  <!-- Screen reflection -->
  <path d="M160 115 L300 115" stroke="#fff" stroke-width="0.5" opacity="0.03"/>
  <path d="M155 118 L240 118" stroke="#fff" stroke-width="0.3" opacity="0.02"/>

  <!-- Decorative floating elements -->
  <circle cx="60" cy="200" r="3" fill="#a85563" opacity="0.15"/>
  <circle cx="740" cy="150" r="2" fill="#a85563" opacity="0.1"/>
  <circle cx="80" cy="420" r="2" fill="#722F37" opacity="0.12"/>
  <circle cx="720" cy="400" r="3.5" fill="#722F37" opacity="0.08"/>
  <circle cx="50" cy="100" r="1.5" fill="#a85563" opacity="0.08"/>
  <circle cx="760" cy="300" r="1" fill="#722F37" opacity="0.1"/>

  <!-- Small decorative shapes -->
  <rect x="30" y="350" width="15" height="15" rx="3" fill="#722F37" opacity="0.06" transform="rotate(30 37 357)"/>
  <circle cx="770" cy="200" r="8" fill="none" stroke="#a85563" stroke-width="0.5" opacity="0.08"/>
</svg>
