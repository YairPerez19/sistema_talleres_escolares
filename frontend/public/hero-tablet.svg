<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a10"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="tabletBody" x1="150" y1="80" x2="650" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="200" y1="120" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#722F37" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a85563"/>
      <stop offset="1" stop-color="#722F37"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#722F37" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#722F37" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a85563" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a85563" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="185" y="115" width="430" height="350" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ambient glow behind tablet -->
  <ellipse cx="400" cy="300" rx="300" ry="220" fill="#722F37" opacity="0.06" filter="url(#glow)"/>

  <!-- Desk surface -->
  <path d="M0 500 Q400 470 800 500 L800 600 L0 600Z" fill="#1a1510" opacity="0.6"/>
  <path d="M0 520 Q400 495 800 520 L800 600 L0 600Z" fill="#151010" opacity="0.4"/>

  <!-- Tablet body -->
  <rect x="155" y="82" width="490" height="420" rx="28" fill="url(#tabletBody)" stroke="#3a3a40" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Tablet bezel highlight -->
  <rect x="157" y="84" width="486" height="416" rx="26" fill="none" stroke="#4a4a50" stroke-width="0.5" opacity="0.5"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="185" y="115" width="430" height="350" fill="#0f0f13"/>

    <!-- Screen grid dots -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#fff" opacity="0.03"/>
    </pattern>
    <rect x="185" y="115" width="430" height="350" fill="url(#dots)"/>

    <!-- Top nav bar -->
    <rect x="185" y="115" width="430" height="44" fill="#161619" opacity="0.9"/>
    <line x1="185" y1="159" x2="615" y2="159" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Logo -->
    <rect x="200" y="129" width="24" height="16" rx="3" fill="#722F37"/>
    <text x="230" y="142" fill="#fff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">SITE</text>
    <text x="262" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" opacity="0.4">| Talleres</text>

    <!-- Search bar -->
    <rect x="410" y="129" width="130" height="22" rx="11" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
    <circle cx="423" cy="140" r="5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="427" y1="144" x2="431" y2="148" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="436" y="143" fill="#fff" font-family="system-ui, sans-serif" font-size="8" opacity="0.3">Buscar taller...</text>

    <!-- User avatar -->
    <circle cx="585" cy="140" r="10" fill="#722F37" opacity="0.4"/>
    <circle cx="585" cy="136" r="3.5" fill="#a85563" opacity="0.6"/>
    <path d="M579 144 Q585 140 591 144" fill="#a85563" opacity="0.4"/>

    <!-- Page title -->
    <text x="205" y="185" fill="#fff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Catálogo de Talleres</text>
    <text x="205" y="200" fill="#fff" font-family="system-ui, sans-serif" font-size="9" opacity="0.4">Semestre Enero - Junio 2026</text>

    <!-- Category pills -->
    <rect x="205" y="210" width="60" height="22" rx="11" fill="#722F37" opacity="0.3"/>
    <text x="220" y="225" fill="#a85563" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Todos</text>
    <rect x="272" y="210" width="72" height="22" rx="11" fill="#ffffff" fill-opacity="0.05"/>
    <text x="282" y="225" fill="#fff" font-family="system-ui, sans-serif" font-size="8" opacity="0.5">Deportes</text>
    <rect x="351" y="210" width="80" height="22" rx="11" fill="#ffffff" fill-opacity="0.05"/>
    <text x="358" y="225" fill="#fff" font-family="system-ui, sans-serif" font-size="8" opacity="0.5">Cultural</text>
    <rect x="438" y="210" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.05"/>
    <text x="445" y="225" fill="#fff" font-family="system-ui, sans-serif" font-size="8" opacity="0.5">Académico</text>

    <!-- Workshop cards row 1 -->
    <!-- Card 1: Futbol -->
    <rect x="205" y="245" width="125" height="95" rx="12" fill="url(#card1)" stroke="#722F37" stroke-opacity="0.2" stroke-width="0.5"/>
    <rect x="213" y="253" width="109" height="48" rx="8" fill="#722F37" opacity="0.15"/>
    <circle cx="268" cy="277" r="16" fill="#722F37" opacity="0.25"/>
    <text x="258" y="273" fill="#a85563" font-family="system-ui, sans-serif" font-size="14">⚽</text>
    <text x="258" y="283" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Promoción Deportiva</text>
    <text x="213" y="315" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Fútbol</text>
    <text x="213" y="327" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">18/20 cupos</text>
    <rect x="213" y="331" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="213" y="331" width="72" height="3" rx="1.5" fill="#a85563" opacity="0.7"/>

    <!-- Card 2: Danza -->
    <rect x="340" y="245" width="125" height="95" rx="12" fill="url(#card2)" stroke="#a85563" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="348" y="253" width="109" height="48" rx="8" fill="#a85563" opacity="0.1"/>
    <circle cx="403" cy="277" r="16" fill="#a85563" opacity="0.2"/>
    <text x="394" y="273" fill="#d4849a" font-family="system-ui, sans-serif" font-size="14">💃</text>
    <text x="393" y="283" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Difusión Cultural</text>
    <text x="348" y="315" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Danza</text>
    <text x="348" y="327" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">12/25 cupos</text>
    <rect x="348" y="331" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="348" y="331" width="40" height="3" rx="1.5" fill="#a85563" opacity="0.5"/>

    <!-- Card 3: Ajedrez -->
    <rect x="475" y="245" width="125" height="95" rx="12" fill="url(#card2)" stroke="#a85563" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="483" y="253" width="109" height="48" rx="8" fill="#a85563" opacity="0.08"/>
    <circle cx="538" cy="277" r="16" fill="#a85563" opacity="0.15"/>
    <text x="529" y="273" fill="#d4849a" font-family="system-ui, sans-serif" font-size="14">♟️</text>
    <text x="529" y="283" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Académico</text>
    <text x="483" y="315" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Ajedrez</text>
    <text x="483" y="327" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">20/20 cupos</text>
    <rect x="483" y="331" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="483" y="331" width="80" height="3" rx="1.5" fill="#4ade80" opacity="0.6"/>

    <!-- Workshop cards row 2 -->
    <!-- Card 4: Basquetbol -->
    <rect x="205" y="350" width="125" height="95" rx="12" fill="url(#card1)" stroke="#722F37" stroke-opacity="0.15" stroke-width="0.5"/>
    <rect x="213" y="358" width="109" height="48" rx="8" fill="#722F37" opacity="0.12"/>
    <circle cx="268" cy="382" r="16" fill="#722F37" opacity="0.2"/>
    <text x="259" y="378" fill="#a85563" font-family="system-ui, sans-serif" font-size="14"></text>
    <text x="259" y="388" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Promoción Deportiva</text>
    <text x="213" y="420" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Basquetbol</text>
    <text x="213" y="432" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">15/20 cupos</text>
    <rect x="213" y="436" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="213" y="436" width="60" height="3" rx="1.5" fill="#a85563" opacity="0.6"/>

    <!-- Card 5: Teatro -->
    <rect x="340" y="350" width="125" height="95" rx="12" fill="url(#card2)" stroke="#a85563" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="348" y="358" width="109" height="48" rx="8" fill="#a85563" opacity="0.1"/>
    <circle cx="403" cy="382" r="16" fill="#a85563" opacity="0.2"/>
    <text x="394" y="378" fill="#d4849a" font-family="system-ui, sans-serif" font-size="14">🎭</text>
    <text x="394" y="388" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Difusión Cultural</text>
    <text x="348" y="420" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Teatro</text>
    <text x="348" y="432" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">8/15 cupos</text>
    <rect x="348" y="436" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="348" y="436" width="43" height="3" rx="1.5" fill="#fbbf24" opacity="0.6"/>

    <!-- Card 6: Taekwondo -->
    <rect x="475" y="350" width="125" height="95" rx="12" fill="url(#card2)" stroke="#a85563" stroke-opacity="0.1" stroke-width="0.5"/>
    <rect x="483" y="358" width="109" height="48" rx="8" fill="#a85563" opacity="0.08"/>
    <circle cx="538" cy="382" r="16" fill="#a85563" opacity="0.15"/>
    <text x="529" y="378" fill="#d4849a" font-family="system-ui, sans-serif" font-size="14">🥋</text>
    <text x="529" y="388" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.5">Promoción Deportiva</text>
    <text x="483" y="420" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="9">Taekwondo</text>
    <text x="483" y="432" fill="#fff" font-family="system-ui, sans-serif" font-size="7" opacity="0.4">20/25 cupos</text>
    <rect x="483" y="436" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="483" y="436" width="64" height="3" rx="1.5" fill="#a85563" opacity="0.5"/>

    <!-- Bottom pagination dots -->
    <circle cx="385" cy="455" r="3" fill="#722F37" opacity="0.8"/>
    <circle cx="400" cy="455" r="3" fill="#fff" opacity="0.15"/>
    <circle cx="415" cy="455" r="3" fill="#fff" opacity="0.15"/>
  </g>

  <!-- Tablet camera dot -->
  <circle cx="400" cy="97" r="3" fill="#1a1a1e" stroke="#2a2a30" stroke-width="0.5"/>
  <circle cx="400" cy="97" r="1.5" fill="#3a3a45" opacity="0.5"/>

  <!-- Tablet reflection streak -->
  <rect x="185" y="115" width="430" height="350" rx="8" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <path d="M210 120 L290 120" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Stylus pen -->
  <rect x="650" y="200" width="6" height="180" rx="3" fill="#2a2a2e" transform="rotate(15 653 290)"/>
  <rect x="650.5" y="205" width="5" height="30" rx="2" fill="#722F37" opacity="0.6" transform="rotate(15 653 290)"/>

  <!-- Decorative floating elements -->
  <circle cx="120" cy="180" r="2" fill="#a85563" opacity="0.3"/>
  <circle cx="680" cy="150" r="1.5" fill="#a85563" opacity="0.2"/>
  <circle cx="100" cy="400" r="1" fill="#a85563" opacity="0.15"/>
  <circle cx="700" cy="450" r="2.5" fill="#722F37" opacity="0.2"/>
</svg>
