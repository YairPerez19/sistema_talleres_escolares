<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Casos de Uso - SITE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 2rem; font-weight: 800; color: #0284C7; letter-spacing: -0.02em; }
    .header p { color: #64748B; font-size: 1rem; margin-top: 0.25rem; font-weight: 500; }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      max-width: 1450px;
      width: 100%;
      overflow-x: auto;
    }
    svg { display: block; width: 100%; height: auto; background: #FFFFFF; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Diagrama de Casos de Uso — SITE</h1>
    <p>Sistema Integral de Talleres Escolares (CBTis No. 61)</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 1400 960" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.04"/>
        </filter>
      </defs>

      <!-- Lienzo Principal SITE (Fondo Blanco Puro) -->
      <rect x="220" y="30" width="960" height="900" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <text x="700" y="62" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">SITE — Sistema Integral de Talleres Escolares</text>

      <!-- MÓDULO 1: Autenticación (Fondo Blanco) -->
      <rect x="250" y="80" width="900" height="150" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="270" y="105" font-size="13" font-weight="bold" fill="#334155">Autenticación y Acceso</text>

      <g filter="url(#shadow)">
        <ellipse cx="360" cy="155" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="159" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Registrarse</text>

        <ellipse cx="540" cy="155" rx="70" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="540" y="159" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Iniciar sesión OTP</text>

        <ellipse cx="730" cy="155" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="730" y="159" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Verificar código</text>

        <ellipse cx="900" cy="155" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="900" y="159" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Seleccionar rol</text>

        <ellipse cx="1060" cy="155" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="1060" y="159" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Recuperar acceso</text>
      </g>

      <!-- Relaciones Autenticación -->
      <path d="M 610 155 L 665 155" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="637" y="148" font-size="9" fill="#64748B" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

      <path d="M 610 155 Q 700 130 835 155" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="730" y="132" font-size="9" fill="#64748B" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

      <!-- MÓDULO 2: Alumno (Fondo Blanco) -->
      <rect x="250" y="250" width="900" height="210" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="270" y="275" font-size="13" font-weight="bold" fill="#334155">Módulo Alumno</text>

      <g filter="url(#shadow)">
        <ellipse cx="360" cy="320" rx="75" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="324" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Ver catálogo de talleres</text>

        <ellipse cx="550" cy="305" rx="65" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="550" y="309" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Filtrar por categoría</text>

        <ellipse cx="550" cy="360" rx="70" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="550" y="364" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Buscar taller por nombre</text>

        <ellipse cx="740" cy="320" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="740" y="324" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Ver detalle de taller</text>

        <ellipse cx="910" cy="320" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="910" y="324" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Inscribirse a taller</text>

        <ellipse cx="360" cy="410" rx="80" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="414" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Consultar estado de cuenta</text>

        <ellipse cx="560" cy="410" rx="65" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="560" y="414" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Ver deuda total</text>
      </g>

      <!-- Relaciones Alumno Internas -->
      <path d="M 485 305 L 435 320" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 480 360 L 435 320" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 845 320 L 805 320" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 495 410 L 440 410" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- MÓDULO 3: Instructor (Fondo Blanco) -->
      <rect x="250" y="480" width="900" height="200" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="270" y="505" font-size="13" font-weight="bold" fill="#334155">Módulo Instructor</text>

      <g filter="url(#shadow)">
        <ellipse cx="360" cy="565" rx="75" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="569" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Registrar asistencia diaria</text>

        <ellipse cx="560" cy="545" rx="75" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="560" y="549" font-size="9" font-weight="bold" fill="#581C87" text-anchor="middle">Marcar estado (Presente/Ausente)</text>

        <ellipse cx="560" cy="605" rx="70" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="560" y="609" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Agregar observaciones</text>

        <ellipse cx="780" cy="565" rx="80" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="780" y="569" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Exportar reporte mensual CSV</text>
      </g>

      <!-- Relaciones Instructor Internas -->
      <path d="M 485 545 L 435 565" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 490 605 L 435 565" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- MÓDULO 4: Administrador (Fondo Blanco) -->
      <rect x="250" y="700" width="900" height="210" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="270" y="725" font-size="13" font-weight="bold" fill="#334155">Módulo Administrador</text>

      <g filter="url(#shadow)">
        <ellipse cx="360" cy="770" rx="65" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="774" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">Crear taller</text>

        <ellipse cx="540" cy="750" rx="70" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="540" y="754" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Subir imagen de taller</text>

        <ellipse cx="540" cy="805" rx="75" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="540" y="809" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Generar descripción con IA</text>

        <ellipse cx="360" cy="860" rx="85" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="360" y="864" font-size="10" font-weight="bold" fill="#78350F" text-anchor="middle">Monitorear en tiempo real</text>

        <ellipse cx="560" cy="860" rx="65" ry="24" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
        <text x="560" y="864" font-size="10" font-weight="bold" fill="#581C87" text-anchor="middle">Filtrar por fecha/taller</text>
      </g>

      <!-- Relaciones Admin Internas -->
      <path d="M 470 750 L 425 770" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 465 805 L 425 770" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M 495 860 L 445 860" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- ACTOR 1: Alumno -->
      <g stroke="#2563EB" stroke-width="2" fill="none">
        <circle cx="90" cy="310" r="14" fill="#DBEAFE"/>
        <line x1="90" y1="324" x2="90" y2="360"/>
        <line x1="70" y1="338" x2="110" y2="338"/>
        <line x1="90" y1="360" x2="72" y2="395"/>
        <line x1="90" y1="360" x2="108" y2="395"/>
      </g>
      <text x="90" y="415" font-size="13" font-weight="bold" fill="#1E40AF" text-anchor="middle">Alumno</text>

      <!-- ACTOR 2: Instructor -->
      <g stroke="#16A34A" stroke-width="2" fill="none">
        <circle cx="90" cy="540" r="14" fill="#DCFCE7"/>
        <line x1="90" y1="554" x2="90" y2="590"/>
        <line x1="70" y1="568" x2="110" y2="568"/>
        <line x1="90" y1="590" x2="72" y2="625"/>
        <line x1="90" y1="590" x2="108" y2="625"/>
      </g>
      <text x="90" y="645" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Instructor</text>

      <!-- ACTOR 3: Administrador -->
      <g stroke="#DC2626" stroke-width="2" fill="none">
        <circle cx="90" cy="760" r="14" fill="#FEE2E2"/>
        <line x1="90" y1="774" x2="90" y2="810"/>
        <line x1="70" y1="788" x2="110" y2="788"/>
        <line x1="90" y1="810" x2="72" y2="845"/>
        <line x1="90" y1="810" x2="108" y2="845"/>
      </g>
      <text x="90" y="865" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">Administrador</text>

      <!-- LÍNEAS DE ASOCIACIÓN -->
      <!-- Alumno -> Autenticacion & Modulo Alumno -->
      <path d="M 115 330 Q 180 155 295 155" fill="none" stroke="#2563EB" stroke-width="1.8"/>
      <path d="M 115 338 L 285 320" fill="none" stroke="#2563EB" stroke-width="1.8"/>
      <path d="M 115 348 L 280 410" fill="none" stroke="#2563EB" stroke-width="1.8"/>

      <!-- Instructor -> Autenticacion & Modulo Instructor -->
      <path d="M 115 560 Q 170 170 470 160" fill="none" stroke="#16A34A" stroke-width="1.8"/>
      <path d="M 115 570 L 285 565" fill="none" stroke="#16A34A" stroke-width="1.8"/>
      <path d="M 115 580 Q 400 580 700 565" fill="none" stroke="#16A34A" stroke-width="1.8"/>

      <!-- Administrador -> Autenticacion & Modulo Administrador -->
      <path d="M 115 780 Q 160 180 470 170" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <path d="M 115 790 L 295 770" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <path d="M 115 800 L 275 860" fill="none" stroke="#DC2626" stroke-width="1.8"/>

      <!-- SERVICIOS EXTERNOS -->
      <g filter="url(#shadow)">
        <rect x="1240" y="125" width="110" height="60" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <text x="1295" y="160" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Supabase Auth</text>

        <rect x="1240" y="775" width="110" height="60" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <text x="1295" y="810" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">API IA</text>
      </g>

      <path d="M 610 155 Q 920 90 1240 155" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 3"/>
      <path d="M 615 805 L 1240 805" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 3"/>
    </svg>
  </div>
</body>
</html>
